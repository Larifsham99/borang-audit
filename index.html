<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borang Audit Pengeluaran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&family=Caladea:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Susun atur: bar atas + panel bertab di kiri + pratonton kertas A4 di kanan (bertindan di telefon) */
:root{
  --bg:#eef1ef; --panel:#ffffff; --fg:#1d2a24; --muted:#5d6b64; --line:#d5ddd8;
  --accent:#1f6b4f; --accent-fg:#ffffff; --danger:#b23a2e; --warn:#9a6a00; --desk:#cfd6d2; --soft:#e3ece7;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --panel:#1c2420; --fg:#e4ebe7; --muted:#9aa8a1; --line:#2f3a35;
  --accent:#4fb08a; --accent-fg:#0d1512; --danger:#e0796d; --warn:#e0b44f; --desk:#0f1311; --soft:#22302a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --panel:#1c2420; --fg:#e4ebe7; --muted:#9aa8a1; --line:#2f3a35;
  --accent:#4fb08a; --accent-fg:#0d1512; --danger:#e0796d; --warn:#e0b44f; --desk:#0f1311; --soft:#22302a; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--ui)}
button,input,textarea,select{font:inherit;color:inherit}

.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px}
.top h1{font-size:15px;margin:0 12px 0 0;font-weight:600}
.top .grow{flex:1}
select,input[type=text],input[type=number],textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input:disabled{opacity:.7}
.rec{width:auto;min-width:200px;max-width:100%}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.del{color:var(--danger)}

.main{display:grid;grid-template-columns:minmax(340px,470px) 1fr}
.side{border-right:1px solid var(--line);position:sticky;top:58px;max-height:calc(100vh - 58px);display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.form{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.preview{background:var(--desk);padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:24px;min-width:0}
.preview .cap{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;align-self:flex-start;margin-bottom:-16px}
.sheet-wrap{position:relative;box-shadow:0 2px 14px rgba(0,0,0,.18);background:#fff;overflow:hidden}
.sheet-wrap > .page{transform-origin:0 0;position:absolute;left:0;top:0}
.sheet-wrap.guides .land-in,.sheet-wrap.guides .port-in{background:linear-gradient(rgba(31,107,79,.10),rgba(31,107,79,.10)) content-box}

fieldset{border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;display:flex;flex-direction:column;gap:10px;background:var(--panel);min-width:0}
legend{font-weight:600;padding:0 6px;font-size:13px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label > span{text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row > *{flex:1;min-width:90px}
.row > .btn{flex:1 1 auto;min-width:auto}
.hint{font-size:12px;color:var(--muted);margin:0}
.hint code{background:var(--soft);padding:0 4px;border-radius:3px}
.ev{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:0}
.ev.bad{color:var(--danger)}
.ev:empty{display:none}
.calc{font-variant-numeric:tabular-nums;font-size:13px;display:grid;grid-template-columns:1fr auto;gap:3px 12px;background:var(--soft);border-radius:6px;padding:10px 12px}
.calc b{text-align:right}
.calc .tot{border-top:1px solid var(--line);padding-top:4px;font-weight:700}
.neg{color:var(--danger)}
.warn{font-size:12px;color:var(--warn);margin:0}
.item{border:1px dashed var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px}
.head{display:flex;gap:6px;align-items:center}
.head strong{flex:1;font-size:12px;color:var(--muted)}
.line{display:grid;grid-template-columns:1fr 110px auto;gap:6px;align-items:start}
.line .btns{display:flex;gap:3px}
.line .ev{grid-column:2}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:13px}
.check input{width:auto;margin:0}
input[type=range]{width:100%}
.ty{width:100%;border-collapse:collapse;font-size:13px}
.ty th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500;text-align:left;padding:4px}
.ty td{padding:3px 4px;border-top:1px solid var(--line)}
.ty td:first-child{width:40%}
.ty input[type=number]{width:70px;padding:4px 6px}
.tg{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid var(--line);border-radius:5px;cursor:pointer;user-select:none}
.tg input{position:absolute;opacity:0;pointer-events:none}
.tg:has(input:checked){background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tg:has(input:focus-visible){outline:2px solid var(--accent)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fit{text-transform:none;letter-spacing:0}
.ovf{color:var(--danger);text-transform:none;letter-spacing:0;font-weight:600;margin-left:8px}
.ovf .btn{margin-left:6px;color:var(--fg)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}

@media (max-width:900px){
  .main{grid-template-columns:1fr}
  .side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
}

/* ---------- Halaman dokumen (sentiasa putih) ---------- */
.page{background:#fff;color:#000;overflow:hidden;position:relative}
.page.land{width:297mm;height:209.5mm}
.page.port{width:210mm;height:296.5mm}
.land-in,.port-in{position:absolute;inset:0;display:flex;flex-direction:column}
.lmain{display:flex;flex-direction:column;width:100%}
.lsign{margin-top:auto;padding-top:6mm}
.lsign .dots{letter-spacing:.12em;font-weight:700;margin-bottom:1em}
.pitems{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:var(--nw,1.6em) 1fr}
.it .n{font-weight:700}
.sub{display:flex;flex-direction:column;margin-top:.15em}
.sub > div{display:grid;grid-template-columns:var(--sw,1.5em) 1fr}
.sub .n{font-weight:700}
.pnote{white-space:pre-line}
.iamt{display:inline-flex;gap:.45em;font-variant-numeric:tabular-nums;white-space:nowrap}
.iamt > span:last-child{text-align:right;display:inline-block}
.irow{margin-top:.05em}
.iright{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:.4em}
.iright .lead{border-bottom:.09em dotted currentColor;min-width:1em;transform:translateY(-.25em)}

#printRoot{position:fixed;left:-10000px;top:0}
@page{size:A4;margin:0}
@page land{size:A4 landscape;margin:0}
@page port{size:A4 portrait;margin:0}
@media print{
  html,body{background:#fff;height:auto}
  .top,.main,.toast{display:none!important}
  #printRoot{position:static;left:auto}
  #printRoot .page{break-after:page;page-break-after:always}
  #printRoot .page:last-child{break-after:auto;page-break-after:auto}
  #printRoot .page.land{page:land}
  #printRoot .page.port{page:port}
  #printRoot.only-land .page.port,#printRoot.only-port .page.land{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<header class="top">
  <h1>Borang Audit Pengeluaran</h1>
  <select id="recSel" class="rec" aria-label="Pilih rekod"></select>
  <button class="btn" id="bNew">+ Baru</button>
  <button class="btn" id="bDup">Salin</button>
  <button class="btn del" id="bDel">Padam</button>
  <span class="grow"></span>
  <select id="pgSel" class="rec" style="min-width:150px" aria-label="Halaman untuk dicetak">
    <option value="both">Kedua-dua halaman</option>
    <option value="land">Landskap sahaja</option>
    <option value="port">Potret sahaja</option>
  </select>
  <button class="btn" id="bPrint">Cetak</button>
  <button class="btn pri" id="bPdf">Muat turun PDF</button>
</header>

<div class="main">
  <aside class="side">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="isi">Isi borang</button>
      <button role="tab" data-tab="kira">Kalkulator</button>
      <button role="tab" data-tab="gaya">Tulisan &amp; margin</button>
      <button role="tab" data-tab="simpan">Simpanan</button>
    </nav>
    <form class="form" id="form" autocomplete="off" onsubmit="return false"></form>
  </aside>

  <section class="preview" id="preview" aria-label="Pratonton">
    <div class="cap">Halaman 1 · A4 landskap <span class="fit" id="fitL"></span> <span class="ovf" id="ovfL" hidden>Kandungan melebihi halaman <button type="button" class="btn sm" data-fit="L">Muatkan automatik</button></span></div>
    <div class="sheet-wrap" id="wrapL"></div>
    <div class="cap">Halaman 2 · A4 potret <span class="fit" id="fitP"></span> <span class="ovf" id="ovfP" hidden>Kandungan melebihi halaman <button type="button" class="btn sm" data-fit="P">Muatkan automatik</button></span></div>
    <div class="sheet-wrap" id="wrapP"></div>
  </section>
</div>

<div id="printRoot"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script>
(function(){
"use strict";
const KEY = "borangAudit.v1";
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));

/* ================= Data asas ================= */
const FONTS = {
  calibri: {n:"Calibri", css:'Calibri,"Carlito",Arial,sans-serif'},
  arial:   {n:"Arial", css:'Arial,"Liberation Sans",Helvetica,sans-serif'},
  times:   {n:"Times New Roman", css:'"Times New Roman","Tinos",Times,serif'},
  cambria: {n:"Cambria", css:'Cambria,"Caladea",Georgia,serif'},
  tahoma:  {n:"Tahoma", css:'Tahoma,Verdana,sans-serif'}
};
const EL_L = [["year","Tahun"],["ke","Pengeluaran ke-"],["tarikh","Tarikh"],["amt","Amaun pengeluaran"],["bakiLepas","Baki sebelum"],["belanja","Pembelanjaan"],["baki","Baki dibawa kehadapan"],["tunai","Tunai"],["tunaiNote","Nota kaki tunai"],["extra","Baris tambahan"]];
const EL_P = [["tajuk","Tajuk projek"],["item","Nama perkara"],["itemAmt","Amaun perkara"],["sub","Pecahan (a, b, c)"],["subAmt","Amaun pecahan"],["jumlah","Jumlah"],["tunaiP","Tunai"],["tunaiNoteP","Nota kaki tunai"],["nota","Catatan"],["sign","Tandatangan"]];
function defStyle(){
  return {
    font:"calibri", lh:1.25, kL:100, kP:100,
    mL:{t:16,r:20,b:14,l:20}, mP:{t:22,r:18,b:18,l:22},
    gapL:5, gapP:2.5, gapTitle:4, gapJumlah:9,
    alignL:"center", vL:"top", alignSign:"center", signPos:"bottom", alignTajuk:"left", upper:true,
    numStyle:"num", subStyle:"alpha", amtLayout:"below", amtDec2:true, amtLeader:true, autoFit:true,
    el:{
      year:{s:44,b:1,i:0,u:0}, ke:{s:34,b:1,i:0,u:0}, tarikh:{s:34,b:1,i:0,u:0}, amt:{s:40,b:1,i:0,u:0},
      bakiLepas:{s:25,b:0,i:0,u:0}, belanja:{s:25,b:0,i:0,u:0}, baki:{s:25,b:0,i:0,u:0}, tunai:{s:25,b:1,i:0,u:0}, tunaiNote:{s:13,b:0,i:1,u:0}, extra:{s:18,b:0,i:0,u:0}, sign:{s:15,b:0,i:0,u:0},
      tajuk:{s:21,b:1,i:0,u:0}, item:{s:20,b:0,i:0,u:0}, itemAmt:{s:20,b:1,i:0,u:0}, sub:{s:17,b:0,i:0,u:0}, subAmt:{s:17,b:0,i:0,u:0},
      jumlah:{s:28,b:1,i:0,u:0}, tunaiP:{s:22,b:1,i:0,u:0}, tunaiNoteP:{s:12,b:0,i:1,u:0}, nota:{s:14,b:0,i:0,u:0}
    }
  };
}
const newItem = () => ({nama:"", amaun:"", auto:false, showSubAmt:false, sub:[]});
function defaults(){
  return {
    id: uid(), nama:"Pengeluaran baru", tahun:String(new Date().getFullYear()), ke:"", tarikh:"",
    amaun:[""], bakiLepas:"", showBakiLepas:false, belanja:"", showBelanja:true, showBaki:true,
    tunaiMode:"auto", tunaiManual:"", tunaiNote:"* Lebihan pembelanjaan dibayar secara tunai.", showTunaiP1:true, showTunaiP2:true,
    sign:"Ustaz Md Mukhtar Bin Tuan Guru Haji Omar Zuhdi", signJawatan:"Mudir", signLayout:"inline", signBracket:false, signDots:true, signTop:"", signExtra:"", signDateOn:true, signDateLabel:"Tarikh disahkan", signDate:"", signDatePos:"below",
    showSign:true, signOn:"p2", extraL:"",
    tajuk:"", items:[newItem()], nota:"",
    label:{pengeluaran:"PENGELUARAN KE-", belanja:"PEMBELANJAAN", baki:"BAKI DIBAWA KEHADAPAN", jumlah:"JUMLAH", bakiLepas:"BAKI SEBELUM", tunai:"TUNAI"},
    dec:false, kalk:[{k:"",a:""}], st:defStyle()
  };
}
function sample(){
  const r = defaults();
  return Object.assign(r, {
    nama:"Pengeluaran 17 & 18 (2025) — contoh", tahun:"2025", ke:"17 DAN 18", tarikh:"(13/10) DAN (22/10) 2025",
    amaun:["70000","30000"],
    tajuk:"NAIK TARAF GARAJ KERETA BELAKANG KANTIN – KANDANG SEMBELIHAN – TUKAR SET CERMIN NAKO ASRAMA BELAKANG – TAMBAHAN PONDOK KAYU (PONDOK BELAKANG) – JALAN WARGA EMAS SERTA BEREK D11 HINGGA D15",
    items:[
      {nama:"BARANG HARDWARE", amaun:"43547.85", auto:false, showSubAmt:false, sub:[]},
      {nama:"KERJA BESI", amaun:"7950", auto:false, showSubAmt:false, sub:[]},
      {nama:"WIRING", amaun:"961", auto:false, showSubAmt:false, sub:[]},
      {nama:"UPAH TUKANG", amaun:"42300", auto:false, showSubAmt:false, sub:[
        "Naik taraf garaj belakang kantin","Naik taraf kendang sembelihan","Pondok kayu E21 dan E22","Pemasangan palung air bumbung dorm",
        "Tukar set cermin nako","Naik taraf jalan warga emas dan penambahan saluran kumbahan","Naik taraf bilik D11 hingga D15"].map(t=>({t,a:""}))}
    ],
    kalk:[{k:"Resit kedai A",a:"12500.50"},{k:"Resit kedai B",a:"8000 + 1250.35"}]
  });
}
function merge(d, s){
  if (s == null || typeof d !== "object" || Array.isArray(d)) return s ?? d;
  if (typeof s !== "object" || Array.isArray(s)) return d;
  const o = {...s}; for (const k in d) o[k] = merge(d[k], s[k]); return o;
}
function normalize(r){
  const m = merge(defaults(), r);
  if (r && r.kL) m.st.kL = r.kL; if (r && r.kP) m.st.kP = r.kP;
  m.amaun = (m.amaun||[]).map(String); if (!m.amaun.length) m.amaun = [""];
  m.items = (m.items||[]).map(it => {
    const x = Object.assign(newItem(), it); x.amaun = String(x.amaun ?? "");
    if (typeof x.sub === "string") x.sub = x.sub.split("\n").map(t=>t.trim()).filter(Boolean).map(t=>({t,a:""}));
    x.sub = (x.sub||[]).map(s => typeof s === "string" ? {t:s,a:""} : {t:s.t||"", a:String(s.a??"")});
    return x;
  });
  if (!r || !r.signOn) m.signOn = "p2";
  if (/^\s*$|^USTAZ MD MUKHTAR BIN HAJI OMAR ZUHDI$/.test(m.sign) && !(r && "signJawatan" in r)){ m.sign = "Ustaz Md Mukhtar Bin Tuan Guru Haji Omar Zuhdi"; m.signJawatan = "Mudir"; }
  if (!Array.isArray(m.kalk) || !m.kalk.length) m.kalk = [{k:"",a:""}];
  return m;
}

/* ================= Simpanan ================= */
let db = {recs:[], cur:null, tab:"isi", guides:false};
try { const raw = localStorage.getItem(KEY); if (raw) db = Object.assign(db, JSON.parse(raw)); } catch(e){}
db.recs = (Array.isArray(db.recs) ? db.recs : []).map(normalize);
if (!db.recs.length){ const s = normalize(sample()); db.recs = [s]; db.cur = s.id; }
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }, 250); }
const cur = () => db.recs.find(r => r.id === db.cur) || db.recs[0];
const getP = (o,p) => p.split(".").reduce((a,k)=>a==null?a:a[k], o);
function setP(o,p,v){ const ks=p.split("."), last=ks.pop(); const t=ks.reduce((a,k)=>a[k],o); t[last]=v; }

/* ================= Kalkulator / nombor ================= */
function ev(x){
  let s = String(x ?? "").trim(); if (!s) return 0;
  s = s.replace(/rm/gi,"").replace(/,/g,"").replace(/[x×]/gi,"*").replace(/÷/g,"/").replace(/\s+/g,"");
  if (!/^[0-9.+\-*/()%]+$/.test(s)) return NaN;
  s = s.replace(/(\d+(?:\.\d+)?)%/g,"($1/100)");
  try { const v = Function('"use strict";return(' + s + ')')(); return (typeof v==="number" && isFinite(v)) ? v : NaN; } catch(e){ return NaN; }
}
const n = x => { const v = ev(x); return isNaN(v) ? 0 : v; };
const isFormula = x => /[+\-*/x×÷%()]/i.test(String(x||"").replace(/^\s*-/,""));
const r2 = v => Math.round(v*100)/100;
function fmt(v, dec){ v = r2(v); const f = !Number.isInteger(v) || dec; return v.toLocaleString("en-US",{minimumFractionDigits:f?2:0, maximumFractionDigits:2}); }
const money = (v, dec) => (v < 0 ? "- " : "") + "RM " + fmt(Math.abs(v), dec);
const itemAmt = it => it.auto ? r2(it.sub.reduce((a,s)=>a+n(s.a),0)) : r2(n(it.amaun));
function totals(r){
  const keluar = r2(r.amaun.reduce((a,b)=>a+n(b),0));
  const lepas = r2(n(r.bakiLepas));
  const dana = r2(keluar + lepas);
  const jumlah = r2(r.items.reduce((a,it)=>a+itemAmt(it),0));
  const manual = String(r.belanja).trim() !== "";
  const belanja = manual ? r2(n(r.belanja)) : jumlah;
  const baki = r2(dana - belanja), on = r.tunaiMode !== "off";
  const tm = String(r.tunaiManual||"").trim() !== "";
  const tunai = !on ? 0 : tm ? r2(n(r.tunaiManual)) : (baki < 0 ? -baki : 0);
  const bakiShow = on && baki < 0 ? 0 : baki;
  return {keluar, lepas, dana, jumlah, belanja, manual, baki, tunai, tunaiManual:tm, bakiShow};
}

/* ================= Jana halaman ================= */
function tstyle(e, k){ return `font-size:${(e.s*k).toFixed(2)}pt;font-weight:${e.b?700:400};font-style:${e.i?"italic":"normal"};text-decoration:${e.u?"underline":"none"}`; }
function roman(i){ return ["i","ii","iii","iv","v","vi","vii","viii","ix","x","xi","xii","xiii","xiv","xv","xvi","xvii","xviii","xix","xx"][i] || String(i+1); }
function subMark(st, j){ return {alpha:"abcdefghijklmnopqrstuvwxyz"[j%26]+".", roman:roman(j)+".", dash:"–", dot:"•", none:""}[st] ?? ""; }
function pageLand(r, kk){
  const S = r.st, E = S.el, k = (kk ?? S.kL)/100, t = totals(r), L = r.label, m = S.mL;
  const ts = key => tstyle(E[key], k);
  const amts = r.amaun.filter(a=>String(a).trim()!=="").map((a,i)=> (i===0?"RM ":"") + fmt(n(a), r.dec)).join(" + ") || "RM 0";
  const extra = String(r.extraL||"").split("\n").filter(l=>l.trim()).map(l=>`<div style="${ts("extra")}">${esc(l)}</div>`).join("");
  return `<div class="page land" style="font-family:${FONTS[S.font].css};line-height:${S.lh}"><div class="land-in" style="padding:${m.t}mm ${m.r}mm ${m.b}mm ${m.l}mm">
    <div class="lmain" style="gap:${S.gapL}mm;text-align:${S.alignL};${S.vL==="center"?"margin-block:auto":""}">
      ${r.tahun ? `<div style="${ts("year")}">(${esc(r.tahun)})</div>` : ""}
      <div style="${ts("ke")}">${esc(L.pengeluaran)} ${esc(r.ke)}</div>
      ${r.tarikh ? `<div style="${ts("tarikh")}">${esc(r.tarikh)}</div>` : ""}
      <div style="${ts("amt")}">= ${amts}</div>
      ${r.showBakiLepas ? `<div style="${ts("bakiLepas")}">${esc(L.bakiLepas)} = ${money(t.lepas, r.dec)}</div>` : ""}
      ${r.showBelanja ? `<div style="${ts("belanja")}">${esc(L.belanja)} = ${money(t.belanja, r.dec)}</div>` : ""}
      ${r.showBaki ? `<div style="${ts("baki")}">${esc(L.baki)} = ${money(t.bakiShow, r.dec)}</div>` : ""}
      ${t.tunai > 0 && r.showTunaiP1 ? `<div style="${ts("tunai")}">${esc(L.tunai)} = ${money(t.tunai, r.dec)}</div>${String(r.tunaiNote||"").trim()?`<div style="${ts("tunaiNote")};margin-top:-${(S.gapL*0.6).toFixed(1)}mm">${esc(r.tunaiNote)}</div>`:""}` : ""}
      ${extra}
    </div>
    ${(r.signOn==="p1"||r.signOn==="both") ? signHtml(r, k, true) : ""}
  </div></div>`;
}
function signHtml(r, k, bottom){
  const S = r.st;
  const nm = String(r.sign||"").trim(), jw = String(r.signJawatan||"").trim();
  const name = nm ? (r.signBracket ? `(${esc(nm)})` : esc(nm)) : "";
  const ln = t => t ? `<div>${t}</div>` : "";
  let body = "";
  if (r.signLayout === "inline") body = ln(jw && name ? `${esc(jw)} : ${name}` : (esc(jw) || name));
  else if (r.signLayout === "above") body = ln(esc(jw)) + ln(name);
  else body = ln(name) + ln(esc(jw));
  const extra = String(r.signExtra||"").split("\n").filter(l=>l.trim()).map(l=>ln(esc(l))).join("");
  const top = String(r.signTop||"").trim() ? `<div style="margin-bottom:.6em">${esc(r.signTop)}</div>` : "";
  const dl = String(r.signDateLabel||"").trim(), dv = String(r.signDate||"").trim() || "....................";
  const date = r.signDateOn ? `<div style="${r.signDatePos==="above"?"margin-bottom:.6em":"margin-top:.3em"}">${dl?esc(dl)+" : ":""}${esc(dv)}</div>` : "";
  return `<div class="lsign" style="${tstyle(S.el.sign, k)};text-align:${S.alignSign};${bottom?"":"margin-top:12mm"}">${top}${r.signDatePos==="above"?date:""}${r.signDots?`<div class="dots">..............................</div>`:""}${body}${extra}${r.signDatePos!=="above"?date:""}</div>`;
}
function pagePort(r, kk){
  const S = r.st, E = S.el, k = (kk ?? S.kP)/100, t = totals(r), m = S.mP;
  const ts = key => tstyle(E[key], k);
  const lay = S.amtLayout || "below", d2 = r.dec || (lay !== "inline" && S.amtDec2);
  const numW = Math.max(4, ...r.items.map(it => fmt(Math.abs(itemAmt(it)), d2).length + (itemAmt(it) < 0 ? 2 : 0))) + 0.6;
  const amtBox = v => `<span class="iamt" style="${ts("itemAmt")}"><span>RM</span><span style="width:${numW}ch">${v<0?"- ":""}${fmt(Math.abs(v), d2)}</span></span>`;
  const items = r.items.map((it,i)=>{
    const subs = it.sub.filter(s=>s.t.trim() || String(s.a).trim());
    const v = itemAmt(it);
    let head;
    if (lay === "below") head = `<div>${esc(it.nama)}</div><div class="irow">${amtBox(v)}</div>`;
    else if (lay === "right") head = `<div class="iright"><span>${esc(it.nama)}</span>${S.amtLeader?`<span class="lead"></span>`:`<span></span>`}${amtBox(v)}</div>`;
    else { const amt = `<span style="${ts("itemAmt")}">${money(v, r.dec)}</span>`; head = subs.length ? `${esc(it.nama)} = ${amt} :` : `${esc(it.nama)} ${amt}`; }
    const sl = subs.length ? `<div class="sub" style="${ts("sub")};--sw:${S.subStyle==="none"?"0":S.subStyle==="roman"?"2em":"1.5em"}">${subs.map((s,j)=>
      `<div><span class="n">${subMark(S.subStyle,j)}</span><span>${esc(s.t)}${it.showSubAmt && String(s.a).trim() ? ` = <span style="${ts("subAmt")}">${money(n(s.a), r.dec)}</span>` : ""}</span></div>`).join("")}</div>` : "";
    const num = S.numStyle==="num" ? `${i+1}.` : S.numStyle==="paren" ? `${i+1})` : "";
    return `<div class="it" style="${ts("item")};--nw:${S.numStyle==="none"?"0":"1.6em"}"><span class="n">${num}</span><div>${head}${sl}</div></div>`;
  }).join("");
  return `<div class="page port" style="font-family:${FONTS[S.font].css};line-height:${S.lh}"><div class="port-in" style="padding:${m.t}mm ${m.r}mm ${m.b}mm ${m.l}mm">
    ${r.tajuk ? `<div style="${ts("tajuk")};text-align:${S.alignTajuk};text-transform:${S.upper?"uppercase":"none"};white-space:pre-line;line-height:${S.lh*1.1};margin-bottom:${S.gapTitle}mm">${esc(r.tajuk)}</div>` : ""}
    <div class="pitems" style="gap:${S.gapP}mm">${items}</div>
    <div style="${ts("jumlah")};margin-top:${S.gapJumlah}mm">${esc(r.label.jumlah)} ${money(t.jumlah, r.dec)}</div>
    ${t.tunai > 0 && r.showTunaiP2 ? `<div style="${ts("tunaiP")};margin-top:3mm">${esc(r.label.tunai)} ${money(t.tunai, r.dec)}</div>${String(r.tunaiNote||"").trim()?`<div style="${ts("tunaiNoteP")};margin-top:1.5mm">${esc(r.tunaiNote)}</div>`:""}` : ""}
    ${r.nota ? `<div class="pnote" style="${ts("nota")};margin-top:6mm">${esc(r.nota)}</div>` : ""}
    ${(r.signOn==="p2"||r.signOn==="both") ? signHtml(r, k, S.signPos==="bottom") : ""}
  </div></div>`;
}

const MM = 96/25.4;
function fitPreview(){
  const avail = Math.max(260, $("preview").clientWidth - 32);
  [["wrapL",297,210],["wrapP",210,297]].forEach(([id,w,h])=>{
    const el = $(id), pw = w*MM, ph = h*MM, s = Math.min(1, avail/pw);
    el.style.width = pw*s+"px"; el.style.height = ph*s+"px";
    const pg = el.firstElementChild; if (pg) pg.style.transform = `scale(${s})`;
  });
}
function render(){
  const r = cur();
  // Muat automatik: kecilkan skala sementara sehingga semua kandungan (termasuk tandatangan) muat dalam kertas
  let kL = r.st.kL, kP = r.st.kP;
  $("printRoot").innerHTML = pageLand(r, kL) + pagePort(r, kP);
  if (r.st.autoFit){
    let o = overflows();
    while ((o.L && kL > 40) || (o.P && kP > 40)){
      if (o.L) kL -= 1; if (o.P) kP -= 1;
      $("printRoot").innerHTML = pageLand(r, kL) + pagePort(r, kP); o = overflows();
    }
  }
  fitInfo = {L: kL !== r.st.kL ? kL : 0, P: kP !== r.st.kP ? kP : 0};
  $("wrapL").innerHTML = pageLand(r, kL); $("wrapP").innerHTML = pagePort(r, kP);
  $("wrapL").classList.toggle("guides", !!db.guides); $("wrapP").classList.toggle("guides", !!db.guides);
  fitPreview(); refresh(); checkOverflow();
  const opt = $("recSel").querySelector(`option[value="${r.id}"]`); if (opt) opt.textContent = r.nama || "(tanpa nama)";
}

function overflows(){
  const [l,p] = [...$("printRoot").querySelectorAll(".land-in,.port-in")];
  const o = el => el && el.scrollHeight > el.clientHeight + 1;
  return {L:o(l), P:o(p)};
}
let fitInfo = {L:0, P:0};
function checkOverflow(){
  const o = overflows(); $("ovfL").hidden = !o.L; $("ovfP").hidden = !o.P;
  $("fitL").textContent = fitInfo.L ? `· dimuatkan automatik ke ${fitInfo.L}%` : "";
  $("fitP").textContent = fitInfo.P ? `· dimuatkan automatik ke ${fitInfo.P}%` : "";
}
$("preview").addEventListener("click", e=>{
  const b = e.target.closest("[data-fit]"); if (!b) return;
  const side = b.dataset.fit, r = cur(), key = "k"+side;
  while (overflows()[side] && r.st[key] > 50){ r.st[key] -= 2; $("printRoot").innerHTML = pageLand(r) + pagePort(r); }
  save(); drawForm(); toast(overflows()[side] ? "Masih melebihi: kurangkan margin atau jarak" : `Skala tulisan dikecilkan ke ${r.st[key]}%`);
});

    <table class="ty"><thead><tr><th>Elemen</th><th>Saiz (pt)</th><th colspan="3">Gaya</th></tr></thead><tbody>${tyRows(EL_L)}</tbody></table>
  </fieldset>
  <fieldset><legend>Halaman 2 · Potret</legend>
    ${fRange("st.kP","Skala semua tulisan",50,150,2,"%")}
    <span class="hint">Margin (mm)</span>${mg("st.mP")}
    ${fRange("st.gapTitle","Jarak selepas tajuk",0,25,0.5," mm")}
    ${fRange("st.gapP","Jarak antara perkara",0,15,0.5," mm")}
    ${fRange("st.gapJumlah","Jarak sebelum jumlah",0,40,1," mm")}
    <div class="row">${fSel("st.alignTajuk","Jajaran tajuk",[["left","Kiri"],["center","Tengah"],["justify","Rata"]])}${fSel("st.numStyle","Nombor perkara",[["num","1."],["paren","1)"],["none","Tiada"]])}${fSel("st.subStyle","Tanda pecahan",[["alpha","a."],["roman","i."],["dash","–"],["dot","•"],["none","Tiada"]])}</div>
    ${fChk("st.upper","Tajuk huruf besar semua")}
    ${fSel("st.amtLayout","Susunan amaun perkara",[["below","Di bawah nama perkara (lajur sejajar)"],["right","Di sebelah kanan (lajur sejajar)"],["inline","Sebaris dengan nama (asal)"]])}
    <div class="row">${fChk("st.amtDec2","Seragamkan 2 tempat perpuluhan (.00)")}${fChk("st.amtLeader","Garis titik ke amaun (susunan kanan)")}</div>
    <div class="row">${fSel("st.alignSign","Jajaran tandatangan",[["center","Tengah"],["left","Kiri"],["right","Kanan"]])}${fSel("st.signPos","Kedudukan tandatangan (potret)",[["bottom","Bawah halaman"],["after","Selepas jumlah"]])}</div>
    <table class="ty"><thead><tr><th>Elemen</th><th>Saiz (pt)</th><th colspan="3">Gaya</th></tr></thead><tbody>${tyRows(EL_P)}</tbody></table>
  </fieldset>
  <fieldset><legend>Label</legend>
    <div class="row">${fText("label.pengeluaran","Pengeluaran")}${fText("label.jumlah","Jumlah")}</div>
    <div class="row">${fText("label.belanja","Pembelanjaan")}${fText("label.baki","Baki")}</div>
    ${fText("label.bakiLepas","Baki sebelum")}
  </fieldset>
  <fieldset><legend>Tetapan gaya</legend>
    <div class="row">
      <button type="button" class="btn" data-act="styleAll">Guna gaya ini untuk semua rekod</button>
      <button type="button" class="btn del" data-act="styleReset">Set semula gaya asal</button>
    </div>
    <p class="hint">Rekod baru akan ikut gaya dan label rekod yang sedang dibuka.</p>
  </fieldset>`;
}

function tabSimpan(){
  return `<fieldset><legend>Sandaran</legend>
    <p class="hint">Semua rekod disimpan automatik dalam pelayar ini. Simpan sandaran ke fail supaya tidak hilang, atau untuk pindah ke komputer lain.</p>
    <div class="row"><button type="button" class="btn pri" data-act="export">Simpan sandaran (.json)</button>
    <button type="button" class="btn" data-act="import">Buka sandaran</button></div>
  </fieldset>`;
}

function drawForm(focusPath){
  const tab = db.tab || "isi";
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab));
  const f = $("form"), st = f.scrollTop;
  f.innerHTML = ({isi:tabIsi, kira:tabKira, gaya:tabGaya, simpan:tabSimpan}[tab])();
  f.scrollTop = st;
  $("recSel").innerHTML = db.recs.map(x=>`<option value="${x.id}">${esc(x.nama||"(tanpa nama)")}</option>`).join("");
  $("recSel").value = cur().id;
  render();
  if (focusPath){ const el = f.querySelector(`[data-k^="${focusPath}"]`); if (el){ el.focus(); el.scrollIntoView({block:"nearest"}); } }
}

/* Kemas kini paparan kiraan tanpa lukis semula borang */
function refresh(){
  const r = cur(), t = totals(r), f = $("form");
  f.querySelectorAll("[data-ev]").forEach(o=>{
    const x = val(o.dataset.ev), v = ev(x);
    o.classList.toggle("bad", isNaN(v));
    o.textContent = isNaN(v) ? "Formula tidak sah — guna nombor dan + − × ÷ ( ) % sahaja" : (isFormula(x) ? "= " + money(v,true) : "");
  });
  r.items.forEach((it,i)=>{ if (it.auto){ const el = $(idOf("items."+i+".amaun")); if (el) el.value = fmt(itemAmt(it), true); } });
  const sum = `<span>Baki sebelum</span><b>${money(t.lepas,true)}</b>
    <span>Pengeluaran (${r.amaun.filter(a=>String(a).trim()).map(a=>fmt(n(a))).join(" + ")||"0"})</span><b>${money(t.keluar,true)}</b>
    <span class="tot">Jumlah dana</span><b class="tot">${money(t.dana,true)}</b>
    <span>Jumlah perkara (halaman 2)</span><b>${money(t.jumlah,true)}</b>
    <span>Pembelanjaan ${t.manual?"(manual)":"(auto)"}</span><b>− ${money(t.belanja,true)}</b>
    <span class="tot">Baki dibawa kehadapan</span><b class="tot ${t.bakiShow<0?"neg":""}">${money(t.bakiShow,true)}</b>
    ${t.tunai>0?`<span class="tot">Tunai${t.tunaiManual?" (manual)":" (lebihan belanja)"}</span><b class="tot">${money(t.tunai,true)}</b>`:""}`;
  f.querySelectorAll("[data-tunaiinfo]").forEach(o=>o.textContent = r.tunaiMode==="off" ? "Kiraan tunai dimatikan." : t.tunai>0 ? `Tunai ${money(t.tunai,true)} dipaparkan dan baki ditunjuk sebagai RM 0.` : "Tiada lebihan: baris tunai tidak dipaparkan.");
  f.querySelectorAll("[data-sum],[data-logic]").forEach(o=>o.innerHTML = sum);
  const warns = [];
  if (t.manual && r2(t.belanja - t.jumlah) !== 0) warns.push(`Pembelanjaan manual berbeza ${money(r2(t.belanja - t.jumlah),true)} daripada jumlah perkara.`);
  if (t.baki < 0 && r.tunaiMode === "off") warns.push("Baki negatif: pembelanjaan melebihi dana. Hidupkan kiraan tunai jika lebihan dibayar tunai.");
  if (t.tunaiManual && t.baki < 0 && r2(t.tunai + t.baki) !== 0) warns.push(`Tunai manual berbeza dengan lebihan belanja ${money(-t.baki,true)}.`);
  r.items.forEach((it,i)=>{ if (!it.auto && it.sub.some(s=>String(s.a).trim())){ const ss = r2(it.sub.reduce((a,s)=>a+n(s.a),0)); if (ss !== itemAmt(it)) warns.push(`Perkara ${i+1}: jumlah pecahan ${money(ss,true)} tidak sama dengan amaun ${money(itemAmt(it),true)}.`); } });
  f.querySelectorAll("[data-warn]").forEach(o=>{ o.hidden = !warns.length; o.innerHTML = warns.map(esc).join("<br>"); });
  const kt = f.querySelector("[data-kalktot]"); if (kt) kt.textContent = money(r2(r.kalk.reduce((a,x)=>a+n(x.a),0)),true);
}

/* ================= Peristiwa ================= */
$("form").addEventListener("input", e=>{
  const el = e.target;
  if (el.id === "guides"){ db.guides = el.checked; save(); render(); return; }
  const p = el.dataset.k; if (!p) return;
  const t = el.dataset.t;
  const v = t==="b" ? el.checked : t==="b01" ? (el.checked?1:0) : t==="n" ? (el.value===""?0:+el.value) : el.value;
  setP(cur(), p, v);
  const sh = $("form").querySelector(`[data-show="${p}"]`); if (sh) sh.textContent = v + (el.dataset.unit||"");
  save();
  if (el.dataset.redraw) drawForm(); else render();
});
$("form").addEventListener("change", e=>{
  if (e.target.id === "ambilBaki" && e.target.value){
    const o = db.recs.find(x=>x.id===e.target.value); if (!o) return;
    const r = cur(); r.bakiLepas = String(totals(o).baki); r.showBakiLepas = true; save(); drawForm(); toast("Baki diambil dari " + (o.nama||"rekod"));
  }
});
const TPL = {amt:()=>"", item:newItem, sub:()=>({t:"",a:""}), kalk:()=>({k:"",a:""})};
$("form").addEventListener("click", e=>{
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const r = cur(), act = b.dataset.act, p = b.dataset.p, i = +b.dataset.i;
  const arr = p ? getP(r,p) : null;
  if (act === "add"){ arr.push(TPL[b.dataset.i]()); save(); drawForm(p+"."+(arr.length-1)); return; }
  if (act === "del"){ arr.splice(i,1); if (!arr.length && p!=="items" && !p.endsWith(".sub")) arr.push(TPL[p==="kalk"?"kalk":"amt"]()); }
  else if (act === "up" || act === "down"){ const j = act==="up"?i-1:i+1; [arr[i],arr[j]] = [arr[j],arr[i]]; }
  else if (act === "kalkSend" || act === "kalkSub"){
    const to = $("kalkTo").value, tot = r2(r.kalk.reduce((a,x)=>a+n(x.a),0)), rows = r.kalk.filter(x=>x.k.trim()||String(x.a).trim());
    if (!rows.length){ toast("Kalkulator masih kosong"); return; }
    let it = null;
    if (to.startsWith("item:")) it = r.items[+to.slice(5)];
    else if (to === "newitem"){ it = newItem(); r.items.push(it); }
    if (act === "kalkSub"){
      if (!it){ toast("Pilih perkara untuk menerima pecahan"); return; }
      rows.forEach(x=>it.sub.push({t:x.k, a:String(r2(n(x.a)))})); it.auto = true; it.showSubAmt = true;
      toast(`${rows.length} pecahan ditambah`);
    } else {
      const s = String(tot);
      if (it){ it.auto = false; it.amaun = s; }
      else if (to === "belanja") r.belanja = s;
      else if (to === "amaun") r.amaun.push(s);
      else if (to === "bakiLepas"){ r.bakiLepas = s; r.showBakiLepas = true; }
      toast("Jumlah " + money(tot,true) + " dihantar");
    }
  }
  else if (act === "today"){ const d = new Date(); r.signDate = `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`; }
  else if (act === "kalkClear") r.kalk = [{k:"",a:""}];
  else if (act === "styleAll"){ db.recs.forEach(x=>{ x.st = clone(r.st); x.label = clone(r.label); x.dec = r.dec; }); toast("Gaya digunakan untuk semua rekod"); }
  else if (act === "styleReset"){ r.st = defStyle(); toast("Gaya asal dipulihkan"); }
  else if (act === "export") return exportJson();
  else if (act === "import") return $("fileIn").click();
  save(); drawForm();
});
document.querySelector(".tabs").addEventListener("click", e=>{ const b = e.target.closest("[data-tab]"); if (!b) return; db.tab = b.dataset.tab; save(); $("form").scrollTop = 0; drawForm(); });

/* ================= Rekod ================= */
$("recSel").addEventListener("change", e=>{ db.cur = e.target.value; save(); drawForm(); });
$("bNew").onclick = ()=>{ const c = cur(), x = defaults(); x.st = clone(c.st); x.label = clone(c.label); x.dec = c.dec; ["sign","signJawatan","signLayout","signBracket","signDots","signTop","signExtra","signOn","signDateOn","signDateLabel","signDatePos"].forEach(f=>x[f]=c[f]);
  x.bakiLepas = String(totals(c).baki); x.showBakiLepas = c.showBakiLepas;
  db.recs.unshift(x); db.cur = x.id; db.tab = "isi"; save(); drawForm(); $(idOf("nama")).select(); toast("Rekod baru dibuat. Baki sebelum diambil dari rekod tadi."); };
$("bDup").onclick = ()=>{ const x = clone(cur()); x.id = uid(); x.nama = (x.nama||"") + " (salinan)"; db.recs.unshift(x); db.cur = x.id; save(); drawForm(); toast("Rekod disalin"); };
let delArm = 0;
$("bDel").onclick = ()=>{
  if (Date.now() - delArm > 3000){ delArm = Date.now(); $("bDel").textContent = "Tekan lagi untuk padam"; setTimeout(()=>{ $("bDel").textContent="Padam"; }, 3000); return; }
  delArm = 0; $("bDel").textContent = "Padam";
  db.recs = db.recs.filter(r=>r.id!==db.cur); if (!db.recs.length) db.recs.push(defaults());
  db.cur = db.recs[0].id; save(); drawForm(); toast("Rekod dipadam");
};

/* ================= Sandaran ================= */
function download(blob, name){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const safeName = s => (s||"borang").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_").slice(0,60) || "borang";
function exportJson(){
  download(new Blob([JSON.stringify({recs:db.recs},null,2)],{type:"application/json"}), `sandaran_borang_audit_${new Date().toISOString().slice(0,10)}.json`);
  toast("Sandaran disimpan");
}
$("fileIn").onchange = async e=>{
  const f = e.target.files[0]; if (!f) return;
  try{
    const d = JSON.parse(await f.text());
    const recs = Array.isArray(d.recs) ? d.recs : (d.items ? [d] : null); if (!recs || !recs.length) throw 0;
    recs.map(normalize).forEach(m=>{ db.recs = db.recs.filter(x=>x.id!==m.id); db.recs.push(m); });
    db.cur = recs[0].id || db.recs[0].id; save(); drawForm(); toast(`${recs.length} rekod dibuka`);
  }catch(_){ toast("Fail ini bukan sandaran borang audit yang sah"); }
  e.target.value = "";
};

/* ================= Cetak & PDF ================= */
function setPrintPages(){ const v = $("pgSel").value; $("printRoot").className = v==="both" ? "" : "only-"+v; return v; }
$("bPrint").onclick = ()=>{ setPrintPages(); window.print(); };
$("bPdf").onclick = async ()=>{
  if (!window.html2canvas || !window.jspdf){ toast("Pustaka PDF belum dimuat (perlu internet). Guna Cetak → Simpan sebagai PDF."); return; }
  const v = setPrintPages(), btn = $("bPdf"); btn.disabled = true; btn.textContent = "Menjana…";
  try{
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const pages = [...$("printRoot").querySelectorAll(".page")].filter(p=> v==="both" || p.classList.contains(v));
    const { jsPDF } = window.jspdf; let pdf = null;
    for (const p of pages){
      const land = p.classList.contains("land"), o = land ? "landscape" : "portrait";
      const c = await html2canvas(p, {scale:2.5, backgroundColor:"#ffffff", logging:false});
      if (!pdf) pdf = new jsPDF({orientation:o, unit:"mm", format:"a4"}); else pdf.addPage("a4", o);
      pdf.addImage(c.toDataURL("image/jpeg", .95), "JPEG", 0, 0, land?297:210, land?210:297);
    }
    pdf.save(`${safeName(cur().nama)}.pdf`); toast("PDF dimuat turun");
  }catch(err){ console.error(err); toast("Gagal menjana PDF. Cuba Cetak → Simpan sebagai PDF."); }
  btn.disabled = false; btn.textContent = "Muat turun PDF";
};

let tt; function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),2600); }
window.addEventListener("resize", fitPreview);
drawForm();
})();
</script>
